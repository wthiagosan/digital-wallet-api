name: CI / Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Java 21 LTS - Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wallet_db
          POSTGRES_USER: wallet_user
          POSTGRES_PASSWORD: wallet_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U wallet_user -d wallet_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Full Test Suite (82 Tests)
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: wallet_db
          DB_USER: wallet_user
          DB_PASS: wallet_pass
        run: ./mvnw clean test

      - name: Package Standalone Fat JAR
        run: ./mvnw package -DskipTests
